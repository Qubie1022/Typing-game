<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TypeQuest 冒險打字王</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a1f;--panel:#17123a;--line:#3a2f7a;--tx:#e8e6ff;--mu:#9a93d0;--cy:#3df0ff;--mg:#ff3d9a;--am:#ffc23d;--ac:var(--cy);
--f-pinky:#ff3d9a;--f-ring:#ff8a3d;--f-mid:#ffd23d;--f-idx:#3df0ff;--f-th:#6c64a8}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
h1,h2,.d{font-family:"Chakra Petch","Noto Sans TC",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.hide{display:none!important}
/* menu */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:700;letter-spacing:.02em}
.logo b{color:var(--ac)}
.xp{min-width:200px}
.bar{height:10px;background:#0006;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.bar.hp i{background:var(--mg)}
.daily{margin:18px 0;padding:16px;border:1px solid var(--ac);background:linear-gradient(90deg,#3df0ff18,transparent);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--ac);color:#06121a;border:0;border-radius:8px;padding:10px 20px;font-weight:700}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.st:disabled{opacity:.45;cursor:not-allowed}
.st:not(:disabled):hover{border-color:var(--ac)}
.st.boss{border-color:var(--mg)}
.st h3{font-size:17px}
.st small{color:var(--mu)}
.stars{color:var(--am);letter-spacing:2px}
h2{font-size:20px;margin:26px 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bd{padding:4px 10px;border-radius:20px;border:1px dashed var(--line);color:var(--mu);font-size:14px}
.bd.on{border:1px solid var(--am);color:var(--am)}
select{background:#0006;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
label{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
/* game */
#game{display:flex;flex-direction:column;height:100%;max-width:980px;margin:0 auto}
.hud{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.hud .en{grid-column:1/-1;font-size:14px;color:var(--mu);display:flex;justify-content:space-between}
.stats{display:flex;gap:16px;font-family:"Chakra Petch",sans-serif;font-size:18px}
.stats span small{color:var(--mu);font-size:12px;margin-left:3px}
#field{flex:1;position:relative;overflow:hidden;background:
repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 28px)}
.w{z-index:2;position:absolute;transform:translateX(-50%);font-family:"Chakra Petch",monospace;font-size:24px;padding:2px 12px;border:1px solid var(--line);border-radius:6px;background:#17123aee;white-space:nowrap;text-align:center}
.w small{display:block;font:12px "Noto Sans TC",sans-serif;color:var(--mu);line-height:1.2}
.w.act{border-color:var(--ac);box-shadow:0 0 14px var(--ac)}
.w .dn{color:var(--ac)}
.w .nx{color:#06121a;background:var(--am);border-radius:2px}
.w.zap{animation:zap .25s forwards}
@keyframes zap{to{opacity:0;transform:translateX(-50%) scale(1.4);filter:blur(3px)}}
#field.hurt{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#sent{z-index:2;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:"Chakra Petch",monospace;font-size:clamp(20px,4vw,32px);line-height:1.7}
#sent .dn{color:var(--ac)} #sent .nx{background:var(--am);color:#06121a} #sent .er{background:var(--mg)}
.kb{position:relative;padding:8px 8px calc(min(8.2vw,44px)*2.7);border-top:1px solid var(--line);background:#0a0818}
.row{display:flex;justify-content:center;gap:4px;margin:4px 0}
.k{width:min(8.2vw,48px);height:min(8.2vw,44px);display:flex;align-items:center;justify-content:center;border-radius:6px;border:2px solid var(--kc,var(--line));color:var(--kc,var(--mu));font:700 14px "Chakra Petch",sans-serif;text-transform:uppercase}
.k.sp{width:min(40vw,260px)}
.k.on{background:var(--kc);color:#06121a;box-shadow:0 0 12px var(--kc)}
.k.press{transform:translateY(2px);background:#ffffff30}
#hands{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#hands .fs{fill:#f3c9a8;fill-opacity:.4;stroke:#b9835c;stroke-width:1.5;stroke-linejoin:round}
#hands .pb{fill:#0a0818}
#hands .pm{fill:#f3c9a8;fill-opacity:.55}
#hands .po{fill:none;stroke:#b9835c;stroke-width:1.5;stroke-linejoin:round}
#hands .cr{fill:none;stroke:#b9835c;stroke-opacity:.55;stroke-width:1.1}
#hands .nl{fill:#fff;fill-opacity:.35;stroke:#b9835c;stroke-opacity:.8;stroke-width:1}
#hands .tr{fill:none;stroke-width:3;stroke-linecap:round;stroke-opacity:.85}
#hands .fs.act{fill-opacity:.5;stroke-width:2.4}
#hands .fs.fl{fill:#fff!important;fill-opacity:.75}
#hint{text-align:center;font-size:14px;color:var(--mu);min-height:22px}
#hint b{color:var(--am)}
/* result */
#res{position:fixed;inset:0;background:#0d0a1fee;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#res .pn{max-width:440px;width:100%;text-align:center}
#res h2{font-size:28px;margin:0 0 8px}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rg div{background:#0006;border-radius:8px;padding:8px}
.rg b{display:block;font:700 24px "Chakra Petch",sans-serif;color:var(--ac)}
.rg small{color:var(--mu)}
#res p{margin:6px 0;color:var(--mu)}
/* 首頁：羊皮紙藏寶圖風格 */
body.mapbg{background:#3a2412 radial-gradient(circle at 20% 10%,#5a3a1e 0,transparent 50%) fixed}
#menu{--line:#6b4a24;--panel:#dcc38f;font-family:"Noto Serif TC",Georgia,"Songti TC",serif;padding:10px}
#menu .d,#menu h2,#menu h3,#menu .logo{font-family:inherit}
.paper{background:repeating-radial-gradient(circle at 30% 40%,rgba(120,80,30,.06) 0 3px,transparent 3px 9px),linear-gradient(135deg,#dcc38f,#cdb078);border:3px double #6b4a24;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:inset 0 0 40px rgba(90,55,20,.45),0 4px 14px #0008}
#menu .paper h2{margin:0 0 8px;letter-spacing:2px}
#menu .logo b,#menu #me,#menu .stars{color:#8b3a1a!important}
#menu .bd{border:1px dashed #6b4a24;background:rgba(255,240,200,.3)}
#menu .bd.on{border:1px solid #8b3a1a;background:rgba(255,240,200,.65)}
#menu select{background:#f6e7c4;border:2px solid #6b4a24}
#menu .bar{background:#0003;border:2px solid #4d1f0b;height:12px}
#menu .bar i{background:#8b3a1a}
#menu .btn{background:#8b3a1a;border:2px solid #4d1f0b;box-shadow:0 2px 0 #4d1f0b;color:#f6e7c4!important}
#menu .btn:disabled{opacity:.5;cursor:default}
#menu .btn.g{background:transparent;color:#3b2614!important}
#menu .top{margin-bottom:12px}
#menu .xp{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
#menu #av{grid-column:1;grid-row:1/4;font-size:30px;line-height:1}
#menu #lv,#menu .xp .bar,#menu #xpt{grid-column:2}
#menu .xp .bar{margin-right:20px}

#menu .daily{margin:0 0 12px}
#menu .pn{background:none;border:0;padding:0}

#menu .st{border:2px dashed #6b4a24;border-radius:6px;min-height:120px;padding:8px;text-align:center;align-items:center;justify-content:center;background:rgba(255,240,200,.3);font-size:13px}
#menu .st .em{font-size:34px;line-height:1.2}
#menu .st h3{font-size:16px;margin:2px 0}
#menu .st:not(:disabled):hover{border-style:solid;border-color:#8b3a1a}
#menu .st:disabled{opacity:.45;background:rgba(60,35,15,.25)}
#menu .st.cur{animation:tpulse 1.4s infinite;border-color:#8b3a1a;box-shadow:none}
#menu .st.done{background:linear-gradient(135deg,#e8d29a,#b98e4d);border-style:solid}
#menu .st.boss{border-color:#a8281c}
#menu #drillw{margin-top:10px}
#menu #drillw .st{min-height:0;width:100%;flex-direction:row;gap:10px;justify-content:center}
@keyframes tpulse{50%{box-shadow:0 0 14px #8b3a1a}}
@media(prefers-reduced-motion:reduce){#menu .st.cur{animation:none}}
.sc{position:absolute;inset:0;z-index:0}
.sc span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:40px;opacity:.35;letter-spacing:.5em}
#scB{opacity:0;transition:opacity .8s}
.fi{animation:fi 1.4s ease-out}
@keyframes fi{from{opacity:0}}
.st.cur{border-color:var(--am);box-shadow:0 0 14px #ffc23d55}
#drillw{margin-top:14px}
#me{color:var(--am);font-size:14px}
#field::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
#field[data-bg=rain]::before{background:repeating-linear-gradient(90deg,var(--ac) 0 1px,transparent 1px 46px);opacity:.2;-webkit-mask-image:linear-gradient(180deg,transparent,#000 50%,transparent);mask-image:linear-gradient(180deg,transparent,#000 50%,transparent);-webkit-mask-size:100% 240px;mask-size:100% 240px;animation:rain 2.4s linear infinite}
@keyframes rain{to{-webkit-mask-position:0 240px;mask-position:0 240px}}
#field[data-bg=pulse]::before{background:radial-gradient(circle at 50% 100%,var(--ac),transparent 65%);opacity:.12;animation:pul 3s ease-in-out infinite alternate}
@keyframes pul{to{opacity:.32}}
#field[data-bg=scan]::before{inset:auto 0 auto 0;top:-60px;height:60px;background:linear-gradient(180deg,transparent,var(--ac),transparent);opacity:.16;animation:scn 4s linear infinite}
@keyframes scn{to{top:100%}}
body:not(.mapbg){background:#3a2412 radial-gradient(circle at 20% 10%,#5a3a1e 0,transparent 50%) fixed}
#game,#res{--tx:#111;--mu:#333;--panel:#dcc38f;--line:#6b4a24;color:var(--tx)}
#game .bar{background:#0002}
.w{background:#f6e7c4;color:#111}
.w .dn,#sent .dn{color:#777}
#hint b{color:#8a4b12}
#res{background:#2a180aee}
#res .rg div{background:#0001}
#res .rg b{color:#111}
#res p[style]{color:#8a5a00!important}
#res .stars{color:#a86a00}
#menu,#game,#res{--tx:#000;--mu:#000}
body,button,select,option,label,small,h1,h2,h3,.d,.logo b,#me,.btn,.btn.g,.bd,.bd.on,.stars,.st small,#res p,#res p[style],#res .stars,#res .rg b,#hint,#hint b,.k,.k.on,.w,.w .dn,.w .nx,.w small,#sent,#sent .dn,#sent .nx,#sent .er,.stats span,.stats span small,.hud .en,#lv,#xpt,#dtxt{color:#000!important}
.w .dn,#sent .dn{text-decoration:underline}
.kb{background:#e9e2d3}
.k{background:#fff}
.k.on{background:var(--kc)}
.k.press{background:#0002}
/* 關卡：羊皮紙藏寶圖風格 */
:root{--f-pinky:#c0524a;--f-ring:#d08a3a;--f-mid:#c9a82e;--f-idx:#3f8a8f;--f-th:#8a6a44;--paper:repeating-radial-gradient(circle at 30% 40%,rgba(120,80,30,.06) 0 3px,transparent 3px 9px),linear-gradient(135deg,#dcc38f,#cdb078)}
#game,#res{font-family:"Noto Serif TC",Georgia,"Songti TC",serif}
#game .d,#res .d,#res h2{font-family:inherit}
#game .stats,#game .w,#game #sent,#res .rg b,#game .k{font-family:"Courier New",monospace}
#game{padding:10px;gap:10px}
#game .hud,#game #field,#game .kb{border:3px double #6b4a24;border-radius:8px;box-shadow:inset 0 0 40px rgba(90,55,20,.45),0 4px 14px #0008}
#game .hud,#game .kb{background:var(--paper)}
#game .hud{padding:12px 14px}
#game .kb{padding-left:10px;padding-right:10px}
#game .bar{background:#0003;border:2px solid #4d1f0b;height:12px}
#game .bar.hp i{background:#a8281c}
#game .btn,#res .btn{background:#8b3a1a;border:2px solid #4d1f0b;box-shadow:0 2px 0 #4d1f0b;color:#f6e7c4!important;border-radius:6px}
#game .btn.g,#res .btn.g{background:transparent;color:#3b2614!important}
#game .w{background:#f6e7c4;border:2px solid #6b4a24;box-shadow:0 2px 0 #4d1f0b}
#game .w.act{border-color:#8b3a1a;box-shadow:0 0 14px #8b3a1a}

#game .w .nx,#game #sent .nx{background:#8b3a1a;color:#f6e7c4!important}
#game #sent .er{background:#e46a5a}
#game .k{background:#f6e7c4;border:2px solid var(--kc,#4d1f0b)}
#game .k.on{background:var(--kc)}
#game .k.press{background:#0002}
#game #hint{color:#f6e7c4!important}
#game #hint b{color:#f0c060!important}
#game .stars,#res .stars{color:#8b3a1a!important}

#game .spd{flex:1;justify-content:flex-start;gap:8px;margin:0}
#game .spd input{flex:1;max-width:320px;min-width:100px;accent-color:#8b3a1a}
#game #kbw{justify-content:flex-start;gap:20px}
#game .tg{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer}
#game .tg input{accent-color:#8b3a1a;width:18px;height:18px;margin:0}
#game .kb.nh{padding-bottom:8px}
#game{gap:6px}
#game .k{width:min(6.4vw,36px);height:min(6.4vw,32px);font-size:12px}
#game .k.sp{width:min(30vw,200px)}
#game .row{margin:2px 0;gap:3px}
#game .kb{padding-top:6px;padding-bottom:calc(min(6.4vw,32px)*1.7)}
.fs #game,.fs .wrap{max-width:none}
#game,.wrap{max-width:none}
#menu .cols{grid-template-columns:1fr;gap:0}
#menu .badges{flex-direction:column;flex-wrap:nowrap;gap:6px}

</head>
<body>
<div id="menu" class="wrap">
  <div class="top paper">
    <div class="logo d">🗺️ Type<b>Quest</b> 冒險打字王</div>
    <div class="xp"><span id="av"></span><div class="d" id="lv">Lv.1</div><div class="bar"><i id="xpb"></i></div><small id="xpt" style="color:var(--mu)"></small></div>
  </div>
  <div class="daily paper">
    <div><div class="d" style="font-size:18px">今日任務</div><div id="dtxt" style="color:var(--mu)"></div></div>
    <button class="btn" id="dbtn">開始任務</button>
  </div>
  <div class="paper"><h2 class="d">📜 世界地圖</h2>
  <div class="tiles" id="map"></div><div id="drillw"></div></div>
  <div class="cols">
    <div class="paper"><h2 class="d">🏅 成就徽章</h2><div class="pn badges" id="bds"></div></div>
    <div class="paper eq"><h2 class="d">🎒 裝備解鎖</h2><div class="pn">
      <label>鍵盤音效<select id="sndS"></select></label>
      <label>介面色彩<select id="thmS"></select></label>
      <label>角色造型<select id="avS"></select></label>
      <label>動態背景<select id="bgS"></select></label>
      <label>頭銜<select id="ttS"></select></label>
      <small style="display:block;font-size:13px">升級解鎖音效、色彩、造型與背景；達成成就可獲得頭銜。</small>
      </div></div>
  </div>
  <p style="color:#f6e7c4;margin:6px 0 0;font-size:13px;text-align:center">進度會儲存在這台裝置的瀏覽器中。</p>
</div>

<div id="game" class="hide">
  <div class="hud">
    <div><div class="d" id="gname"></div><div class="bar hp"><i id="ehp" style="width:100%"></i></div></div>
    <div class="stats"><span id="wpm">0<small>WPM</small></span><span id="acc">100<small>%</small></span><span id="cmb">0<small>連擊</small></span></div>
    <div class="en"><span id="php"></span><span id="tmr"></span><button class="btn g" id="quit" style="padding:2px 12px">離開</button></div>
    <div class="en" id="spdw"><label class="spd">🐢 單字速度<input type="range" id="spd" min="30" max="200" step="10" value="100" aria-label="單字掉落速度">🐇<b id="spdv">1.0×</b></label></div>
    <div class="en" id="kbw"><label class="tg"><input type="checkbox" id="kbt" checked>⌨️ 虛擬鍵盤</label><label class="tg"><input type="checkbox" id="hdt" checked>✋ 手指動畫</label><button class="btn g" id="allt" style="padding:2px 12px">全部關閉</button></div>
  </div>
  <div id="field"><div class="sc" id="scA"></div><div class="sc" id="scB"></div><div id="sent" class="hide"></div></div>
  <div id="hint"></div>
  <div class="kb" id="kb"></div>
</div>
<div id="res" class="hide"><div class="pn" id="rbox"></div></div>

 if(!G||G.over||$("#game").classList.contains("hide")||e.ctrlKey||e.metaKey||e.altKey)return;
 const c=e.key.length===1?e.key.toLowerCase():"";if(!c)return;
 if(c===" ")e.preventDefault();
 press(c);
 if(!G.t0)G.t0=performance.now();
 if(G.st.boss){const s=G.st.s[G.sidx],ex=s[G.pos];
  if(c===ex.toLowerCase()){G.hits++;G.cmb++;G.best=Math.max(G.best,G.cmb);sfx("ok");G.pos++;
   if(G.pos>=s.length){G.sidx++;G.pos=0;sfx("kill");if(G.sidx>=G.total)return end(true)}}
  else wrong(ex.toLowerCase());
  renderSent();hintKey(G.st.s[G.sidx][G.pos]);upd();return}
 if(!G.active){const cand=G.ws.filter(o=>o.w[0]===c).sort((a,b)=>b.y-a.y)[0];
  if(cand){G.active=cand;}
  else{const near=G.ws.sort((a,b)=>b.y-a.y)[0];if(near)wrong(near.w[0]);else G.miss++;return}
  document.querySelectorAll(".w.act").forEach(n=>n.classList.remove("act"));G.active.el.classList.add("act")}
 const o=G.active,ex=o.w[o.i];
 if(c===ex){G.hits++;G.cmb++;G.best=Math.max(G.best,G.cmb);sfx("ok");o.i++;
  if(o.i>=o.w.length){kill(o,true);G.hp--;sfx("kill");if(G.hp<=0)return end(true);}
  else hintKey(o.w[o.i]);paint(o)}
 else{wrong(ex);paint(o)}
 if(G.active)hintKey(G.active.w[G.active.i]);
 upd()});
$("#spd").oninput=e=>{S.spd=+e.target.value;$("#spdv").textContent=(S.spd/100).toFixed(1)+"×";save()};
$("#spd").onchange=e=>e.target.blur();
function applyKb(){const id=G.st.id,opt=id===3||id===4,nk=id===5;
 const on=!nk&&(!opt||S.kbOn!==false),hd=on&&(!opt||S.hdOn!==false);
 $("#kbw").classList.toggle("hide",!opt||nk);$("#kbt").checked=S.kbOn!==false;$("#hdt").checked=S.hdOn!==false;$("#hdt").disabled=!$("#kbt").checked;$("#allt").textContent=S.kbOn!==false&&S.hdOn!==false?"全部關閉":"全部開啟";
 $("#kb").classList.toggle("hide",!on);$("#hint").classList.toggle("hide",!on);$("#kb").classList.toggle("nh",!hd);
 const old=$("#hands");if(old)old.remove();if(H){cancelAnimationFrame(H.raf);H=null}
 if(hd)buildHands();
 if(hd&&G.active)hintKey(G.active.w[G.active.i]);else G.aimc=undefined}
$("#kbt").onchange=e=>{S.kbOn=e.target.checked;save();applyKb();e.target.blur()};
$("#hdt").onchange=e=>{S.hdOn=e.target.checked;save();applyKb();e.target.blur()};
$("#allt").onclick=e=>{const on=!(S.kbOn!==false&&S.hdOn!==false);S.kbOn=S.hdOn=on;save();applyKb();e.target.blur()};
function measureRef(){if(!G||G.st.boss)return;const kb=$("#kb"),hn=$("#hint"),a=kb.classList.contains("hide"),b=kb.classList.contains("nh"),c=hn.classList.contains("hide");
 kb.classList.remove("hide","nh");hn.classList.remove("hide");G.refH=$("#field").clientHeight;
 kb.classList.toggle("hide",a);kb.classList.toggle("nh",b);hn.classList.toggle("hide",c)}
addEventListener("resize",measureRef);
function chkFs(){const f=!!document.fullscreenElement||matchMedia("(display-mode: fullscreen)").matches||(innerWidth>=screen.width-2&&innerHeight>=screen.height-2);document.documentElement.classList.toggle("fs",f);measureRef()}
addEventListener("resize",chkFs);document.addEventListener("fullscreenchange",chkFs);chkFs();
$("#quit").onclick=()=>{if(G)G.over=true;cancelAnimationFrame(raf);G=null;back()};
function back(){$("#game").classList.add("hide");$("#res").classList.add("hide");$("#menu").classList.remove("hide");renderMenu()}

function end(win){G.over=true;upd();const acc=G.acc,wpm=G.wpm;let loot=0,stars=0,msgs=[];
 if(win){stars=acc>=95?3:acc>=85?2:1;loot=Math.round((30+wpm*2+G.best)*(1+stars*.25));
  if(G.daily){loot*=2;S.daily=today();msgs.push("今日任務完成：經驗值加倍！")}
  if(G.i>=0)S.stars[G.i]=Math.max(S.stars[G.i]||0,stars);
  S.words=(S.words||0)+G.wd;if(G.i===-1)Object.keys(S.errs).forEach(k=>S.errs[k]=Math.max(0,S.errs[k]-2));
  }
 else loot=Math.round(G.hits/4);
 const nw=check(win,wpm,acc);nw.forEach(n=>msgs.push("🏅 新徽章：「"+n+"」，可在主畫面裝備頭銜"));
 const l0=lvOf(S.xp);S.xp+=loot;const l1=lvOf(S.xp);if(l1>l0)msgs.push(`升級到 Lv.${l1}！可至主畫面查看新裝備`);
 save();sfx(win?"kill":"bad");
 const nx=win&&G.i>=0&&G.i<STAGES.length-1;
 $("#rbox").innerHTML=`<h2 class="d">${win?(G.st.boss?"魔王已被擊敗！":"入侵已擊退"):(G.st.boss?"時間到，防線失守":"防火牆被攻破")}</h2>
 <div class="stars" style="font-size:28px">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
 <div class="rg"><div><b>${wpm}</b><small>WPM</small></div><div><b>${acc}%</b><small>正確率</small></div><div><b>${G.best}</b><small>最高連擊</small></div></div>
 <p>戰利品：+${loot} XP</p>${msgs.map(m=>`<p style="color:var(--am)">${m}</p>`).join("")}
 ${!win?"<p>再試一次：先看清楚單字，再慢慢敲，正確率比速度重要。</p>":""}
 <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">${nx?`<button class="btn" id="next">下一關：${STAGES[G.i+1].n}</button>`:""}<button class="btn${nx?" g":""}" id="again">再玩一次</button><button class="btn g" id="home">回主畫面</button></div>`;
 $("#res").classList.remove("hide");const i=G.i,d=G.daily;
 $("#again").onclick=()=>start(i,false);if($("#next"))$("#next").onclick=()=>start(i+1,false);$("#home").onclick=()=>{G=null;back()}}
renderMenu();
</script>
</body>
</html>
